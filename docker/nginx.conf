server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap động do backend sinh từ DB (SEO tự động, không cần rebuild image)
    location = /sitemap.xml {
        proxy_pass http://backend:8089/sitemap.xml;
        proxy_set_header Host $host;
    }
    location /sitemaps/ {
        proxy_pass http://backend:8089/sitemaps/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
