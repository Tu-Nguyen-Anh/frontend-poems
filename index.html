<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiểu Thi Hào – Kho tàng thơ ca Việt Nam</title>
    <meta name="description" content="Kho tàng thơ ca Việt Nam và thế giới — tra cứu theo tác giả, thể loại, đọc nguyên tác chữ Hán kèm phiên âm, dịch nghĩa và nhiều bản dịch." />
    <meta property="og:site_name" content="Tiểu Thi Hào" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tiểu Thi Hào – Kho tàng thơ ca Việt Nam" />
    <meta property="og:description" content="Kho tàng thơ ca Việt Nam và thế giới — tra cứu theo tác giả, thể loại, đọc nguyên tác kèm phiên âm, dịch nghĩa và nhiều bản dịch." />
    <!-- Google Fonts: Merriweather, Inter, Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
              serif: ['Merriweather', 'Playfair Display', 'Georgia', 'serif'],
            },
            colors: {
              sepia: {
                50: '#fbf0d9',
                100: '#f7e7c4',
                200: '#edd49b',
                300: '#e1bd70',
                700: '#734e1b',
                800: '#5c3d14',
                900: '#432a0d',
              }
            }
          }
        }
      }
    </script>

    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('poems_reader_style_mode') || 'classic-sepia'
          document.documentElement.setAttribute('data-reader-mode', mode)
          // data-theme phải set cùng .dark: token CSS (--c-ink-*) đổi theo [data-theme]
          document.documentElement.setAttribute('data-theme', mode === 'modern-dark' ? 'dark' : 'light')
          if (mode === 'modern-dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-reader-mode', 'classic-sepia')
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <!-- Nền tối ngay từ paint đầu tiên để tránh chớp trắng trước khi CSS bundle tải -->
    <style>
      html.dark, html.dark body { background-color: #0f172a; }
    </style>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
