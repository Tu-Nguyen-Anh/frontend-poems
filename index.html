<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thi Đàn - Kho Tàng Thơ Ca Việt Nam | Frontend-Poems</title>
    <!-- Google Fonts: Merriweather, Inter, Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-reader-mode="modern-dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
              serif: ['Merriweather', 'Playfair Display', 'Georgia', 'serif'],
            },
            colors: {
              sepia: {
                50: '#fbf0d9',
                100: '#f7e7c4',
                200: '#edd49b',
                300: '#e1bd70',
                700: '#734e1b',
                800: '#5c3d14',
                900: '#432a0d',
              }
            }
          }
        }
      }
    </script>

    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('poems_reader_style_mode') || 'classic-sepia'
          document.documentElement.setAttribute('data-reader-mode', mode)
          if (mode === 'modern-dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-reader-mode', 'classic-sepia')
        }
      })()
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
